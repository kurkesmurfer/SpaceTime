  <!-- Legibility pass (2026-08-09, Peet: "go for legibility, as that
       facilitates testing as well"). Coordinates mirror
       src/Head.cpp's LayoutHR namespace exactly  -  keep both in sync
       by hand, there is no shared source of truth between the two files. -->
