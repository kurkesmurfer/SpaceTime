  <!-- Full HeadConfig parity, one row of 8 (pitch 10.4mm)  -  ADDRESS,
       ADDR SOURCE, ADDR MODE, DIRECTION, CLK SOURCE, CLK DIV, TIME CV, LOOP.
       Short labels are the compromise this pitch allows; the digital
       STATUS_DISPLAY spells full state out (source/division/direction/loop
       names) for anyone who needs the unabbreviated reading. -->
  <g fill="#57524c" font-family="Barlow Condensed" font-weight="600" font-size="2.1" text-anchor="middle">
