# -------------------------------------------------
# Masterclock+
# -------------------------------------------------

[button]
    button = B6.26
    onvalue = 1
    offvalue = 0
    led = L6.26
    output = _LEDGAUGE2

[pot]
    ledgauge = 0.8 * _LEDGAUGE2
    notch = 0
    pot = P11.1 * 0.3 + 0.3
    slope = 1
    output = _MASTERRATE

[pot]
    ledgauge = 0.8 * _LEDGAUGE2
    notch = 0
    pot = P11.4
    slope = 1
    output = _CLOCKDELAY1

[pot]
    ledgauge = 0.8 * _LEDGAUGE2
    notch = 0
    pot = P11.6
    slope = 1
    output = _CLOCKDELAY2

[pot]
    ledgauge = 0.8 * _LEDGAUGE2
    notch = 0
    pot = P11.8
    slope = 1
    output = _CLOCKDELAY3

[pot]
    discrete = 4
    ledgauge = 0.8 * _LEDGAUGE2
    notch = 0
    pot = P11.3 + 1
    slope = 1
    output = _DIVCLOCK1

[pot]
    discrete = 4
    ledgauge = 0.8 * _LEDGAUGE2
    notch = 0
    pot = P11.5 + 1
    slope = 1
    output = _DIVCLOCK2

[pot]
    discrete = 4
    ledgauge = 0.8 * _LEDGAUGE2
    notch = 0
    pot = P11.7 + 1
    slope = 1
    output = _DIVCLOCK3

[lfo]
    bipolar = 0
    level = 1
    rate = -1 * 0.2 + _MASTERRATE
    square = _INTERNALCLOCK

[copy]
    input = _INTERNALCLOCK
    output = N1

[copy]
    input = _SECONDARYCLOCK
    output = N5

[copy]
    input = _INTERNALCLOCK
    output = G12

[copy]
    input = _MASTERCLOCK
    output = G9

[copy]
    input = _SECONDARYCLOCK
    output = G10

[copy]
    input = _THIRDCLOCK
    output = G11

[clocktool]
    clock = I1
    delay = _CLOCKDELAY1
    multiply = _DIVCLOCK1
    output = _MASTERCLOCK

[clocktool]
    clock = _MASTERCLOCK
    delay = _CLOCKDELAY2
    divide = _DIVCLOCK2 + 1
    output = _SECONDARYCLOCK

[clocktool]
    clock = _MASTERCLOCK
    delay = _CLOCKDELAY3
    divide = _DIVCLOCK3 + 1
    output = _THIRDCLOCK

