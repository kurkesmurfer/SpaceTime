# SpaceTime Stage feedback: fixed page-1 DROID probe
#
# This diagnostic removes dynamic CC-number selection and uses DROID's MIDI
# input auto-detection. The midiin cc outputs are normalized by DROID from MIDI
# 0-127 to circuit values 0.0-1.0. Those normalized cables feed both R1-R16
# and the sixteen E4 ring overrides.

[s10]
[e4]
[e4]
[e4]
[e4]
[b32]
[p2b8]
[p2b8]
[p2b8]
[p2b8]
[p10]

# B6.1 requests Stage page 1: protocol channel 10, CC2, value 0.
[midiout]
    channel = 10
    usb = 1
    ccnumber1 = 2
    cc1 = 0
    cctrigger1 = B6.1

[copy]
    input = B6.1
    output = L6.1

# Fixed page-1 voltage CC0-7. Leave the input port unspecified so DROID uses
# auto-detection and avoids the blue-7 USB/TRS input-selector reversal.
[midiin]
    channel = 15
    ccnumber1 = 0
    ccnumber2 = 1
    ccnumber3 = 2
    ccnumber4 = 3
    cc1 = _V1
    cc2 = _V2
    cc3 = _V3
    cc4 = _V4

[midiin]
    channel = 15
    ccnumber1 = 4
    ccnumber2 = 5
    ccnumber3 = 6
    ccnumber4 = 7
    cc1 = _V5
    cc2 = _V6
    cc3 = _V7
    cc4 = _V8

# Fixed page-1 time CC64-71.
[midiin]
    channel = 15
    ccnumber1 = 64
    ccnumber2 = 65
    ccnumber3 = 66
    ccnumber4 = 67
    cc1 = _T1
    cc2 = _T2
    cc3 = _T3
    cc4 = _T4

[midiin]
    channel = 15
    ccnumber1 = 68
    ccnumber2 = 69
    ccnumber3 = 70
    ccnumber4 = 71
    cc1 = _T5
    cc2 = _T6
    cc3 = _T7
    cc4 = _T8

# Explicit normalized-value diagnostics on the Master registers.
[copy]
    input = _V1
    output = R1
[copy]
    input = _V2
    output = R2
[copy]
    input = _V3
    output = R3
[copy]
    input = _V4
    output = R4
[copy]
    input = _V5
    output = R5
[copy]
    input = _V6
    output = R6
[copy]
    input = _V7
    output = R7
[copy]
    input = _V8
    output = R8
[copy]
    input = _T1
    output = R9
[copy]
    input = _T2
    output = R10
[copy]
    input = _T3
    output = R11
[copy]
    input = _T4
    output = R12
[copy]
    input = _T5
    output = R13
[copy]
    input = _T6
    output = R14
[copy]
    input = _T7
    output = R15
[copy]
    input = _T8
    output = R16

# Voltage rings, normalized 0.0-1.0.
[encoder]
    encoder = E2.1
    override = _V1
    color = 0.73
[encoder]
    encoder = E2.2
    override = _V2
    color = 0.73
[encoder]
    encoder = E2.3
