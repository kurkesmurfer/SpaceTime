# SpaceTime DROID physical encoder probe
#
# This deliberately contains no MIDI input and no feedback synchronization.
# Turning E2.1 must move its orange ring and send channel 15 CC0 over X7 USB.

[s10]
[e4]
[e4]
[e4]
[e4]
[b32]
[p2b8]
[p2b8]
[p2b8]
[p2b8]
[p10]

[encoder]
    encoder = E2.1
    mode = 1
    ledfill = 1
    smooth = 0
    color = 0.73
    output = R1

[midiout]
    channel = 15
    usb = 1
    trs = 0
    ccnumber1 = 0
    cc1 = R1
