# SpaceTime Stage feedback monitor

# 
# Hardware order matches the existing MARFremote controller chain.
# B6.1-B6.8 select Stage pages 1-8. The sixteen E4 rings display:
# E2.1-E3.4: voltage values for the selected eight stages
# E4.1-E5.4: time values for the selected eight stages
# 
# This first proof is deliberately receive-only. encoder.override makes the
# rings authoritative displays and prevents stale page values being sent back
# to SpaceTime while a snapshot is arriving.

[s10]
[e4]
[e4]
[e4]
[e4]
[b32]
[p2b8]
[p2b8]
[p2b8]
[p2b8]
[p10]

# -------------------------------------------------
# Stage page selection and snapshot request
# -------------------------------------------------

[buttongroup]
    button1 = B6.1
    button2 = B6.2
    button3 = B6.3
    button4 = B6.4
    button5 = B6.5
    button6 = B6.6
    button7 = B6.7
    button8 = B6.8
    led1 = L6.1
    led2 = L6.2
    led3 = L6.3
    led4 = L6.4
    led5 = L6.5
    led6 = L6.6
    led7 = L6.7
    led8 = L6.8
    output = _STAGE_PAGE
    startbutton = 1
    extrapress = _REFRESH_PAGE
    dontsave = 1

# Protocol-v1 request: MIDI channel 10, CC2, page value 0-7. MIDIout maps
# 0.0-1.0 onto 0-127, hence the 1/127 scale. updateccs makes pressing the
# currently selected page button request the same page again.
[midiout]
    channel = 10
    usb = 1
    trs = 0
    ccnumber1 = 2
    cc1 = _STAGE_PAGE * 0.007874015748
    updateccs = _REFRESH_PAGE
    delayinitialccs = 1

# -------------------------------------------------
# Selected page feedback: MIDI channel 15
# -------------------------------------------------

# Voltage stages 1-4 within the selected page.
[midiin]
    channel = 15
    ccnumber1 = _STAGE_PAGE * 8
    ccnumber2 = _STAGE_PAGE * 8 + 1
    ccnumber3 = _STAGE_PAGE * 8 + 2
    ccnumber4 = _STAGE_PAGE * 8 + 3
    cc1 = R1
    cc2 = R2
    cc3 = R3
    cc4 = R4

# Voltage stages 5-8 within the selected page.
[midiin]
    channel = 15
    ccnumber1 = _STAGE_PAGE * 8 + 4
    ccnumber2 = _STAGE_PAGE * 8 + 5
    ccnumber3 = _STAGE_PAGE * 8 + 6
    ccnumber4 = _STAGE_PAGE * 8 + 7
    cc1 = R5
    cc2 = R6
    cc3 = R7
    cc4 = R8

# Time stages 1-4 within the selected page.
[midiin]
    channel = 15
    ccnumber1 = _STAGE_PAGE * 8 + 64
    ccnumber2 = _STAGE_PAGE * 8 + 65
    ccnumber3 = _STAGE_PAGE * 8 + 66
    ccnumber4 = _STAGE_PAGE * 8 + 67
    cc1 = R9
    cc2 = R10
    cc3 = R11
    cc4 = R12

# Time stages 5-8 within the selected page.
[midiin]
    channel = 15
    ccnumber1 = _STAGE_PAGE * 8 + 68
    ccnumber2 = _STAGE_PAGE * 8 + 69
    ccnumber3 = _STAGE_PAGE * 8 + 70
    ccnumber4 = _STAGE_PAGE * 8 + 71
    cc1 = R13
    cc2 = R14
    cc3 = R15
    cc4 = R16

# -------------------------------------------------
# E4 feedback rings
# -------------------------------------------------

# R1-R16 provide an independent receive diagnostic on the Master. A nonzero
# register with a dark matching E4 ring isolates an encoder-display problem;
# a dark register means the MIDI input did not consume that CC.

# Voltage rings use orange.
[encoder]
    encoder = E2.1
    override = R1
    color = 0.73

[encoder]
    encoder = E2.2
    override = R2
    color = 0.73

[encoder]
    encoder = E2.3
    override = R3
    color = 0.73

[encoder]
    encoder = E2.4
    override = R4
    color = 0.73

[encoder]
    encoder = E3.1
    override = R5
    color = 0.73

[encoder]
    encoder = E3.2
    override = R6
    color = 0.73

[encoder]
    encoder = E3.3
    override = R7
    color = 0.73

[encoder]
    encoder = E3.4
    override = R8
    color = 0.73

# Time rings use cyan.
[encoder]
    encoder = E4.1
    override = R9
    color = 0.2

[encoder]
    encoder = E4.2
    override = R10
    color = 0.2

[encoder]
    encoder = E4.3
    override = R11
    color = 0.2

[encoder]
    encoder = E4.4
    override = R12
    color = 0.2

[encoder]
    encoder = E5.1
    override = R13
    color = 0.2

[encoder]
    encoder = E5.2
    override = R14
    color = 0.2

[encoder]
    encoder = E5.3
    override = R15
    color = 0.2

[encoder]
    encoder = E5.4
    override = R16
    color = 0.2
