# SpaceTime DROID authoritative relative-edit probe
#
# B6.1 requests Stage page 1. E2.1 displays Stage 1 voltage feedback and uses
# physical turns to send small increments/decrements from that returned value.
# The first encoder circuit detects movement; the second owns the ring display.

[s10]
[e4]
[e4]
[e4]
[e4]
[b32]
[p2b8]
[p2b8]
[p2b8]
[p2b8]
[p10]

[midiout]
    channel = 10
    usb = 1
    trs = 0
    ccnumber1 = 2
    cc1 = 0
    cctrigger1 = B6.1

# blue-7 input selector workaround: use MIDI-input auto-detection.
[midiin]
    channel = 15
    ccnumber1 = 0
    cc1 = R1

# Physical movement detector. movedup/moveddown remain active at the limits of
# this circuit's private value; that private value is never sent to SpaceTime.
[encoder]
    encoder = E2.1
    mode = 1
    movementticks = 2
    movedup = _UP
    moveddown = _DOWN

# Authoritative display, evaluated after the movement detector.
[encoder]
    encoder = E2.1
    override = R1
    color = 0.73

# Convert the directional trigger into a signed delta using explicit DROID
# circuits. The final minimum/maximum pair clamps the result to 0.0-1.0.
[math]
    input1 = _UP
    input2 = _DOWN
    difference = _DIRECTION

[math]
    input1 = _DIRECTION
    input2 = 0.023622047244
    product = _DELTA

[math]
    input1 = R1
    input2 = _DELTA
    sum = _UNCLAMPED

[math]
    input1 = _UNCLAMPED
    input2 = 0
    maximum = _FLOORED

[math]
    input1 = _FLOORED
    input2 = 1
    minimum = _EDIT

[logic]
    input1 = _UP
    input2 = _DOWN
    or = _MOVE

# Each movement event changes the current returned value by three MIDI steps.
# cctrigger prevents feedback or the end of a movement pulse from transmitting.
[midiout]
    channel = 15
    usb = 1
    trs = 0
    ccnumber1 = 0
    cc1 = _EDIT
    cctrigger1 = _MOVE
