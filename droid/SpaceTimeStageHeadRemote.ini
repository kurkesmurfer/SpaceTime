# -------------------------------------------------
# HEAD selection and HEAD ALL command override
# -------------------------------------------------

# S1.2 is zero-based; MIDI HEAD channels are 1-8.
[math]
    input1 = S1.2
    input2 = 1
    sum = _HEAD_FEEDBACK_CHANNEL

# S1.3 up selects channel 9 (HEAD ALL); down and center address S1.2.
[ifequal]
    input1 = S1.3
    input2 = 2
    ifequal = 9
    else = _HEAD_FEEDBACK_CHANNEL
    output = _HEAD_TARGET_CHANNEL

[ifequal]
    input1 = S1.3
    input2 = 2
    ifequal = 8
    else = S1.2
    output = _HEAD_REQUEST_INDEX

[math]
    input1 = _HEAD_REQUEST_INDEX
    input2 = 0.007874015748
    product = _HEAD_REQUEST_VALUE

# Request the selected HEAD, or all eight HEADs in HEAD ALL mode.
[midiout]
    channel = 10
    usb = 1
    trs = 0
    ccnumber1 = 0
    cc1 = _HEAD_REQUEST_VALUE
    updateccs = B9.4
    delayinitialccs = 1

# -------------------------------------------------
# Selected-HEAD feedback
# -------------------------------------------------

# In HEAD ALL mode SpaceTime returns channels 1-8. The controls display the
# state of the head selected by S1.2 while commands continue to target channel 9.
[midiin]
    channel = _HEAD_FEEDBACK_CHANNEL
    ccnumber1 = 1
    ccnumber2 = 2
    ccnumber3 = 3
    ccnumber4 = 4
    cc1 = _HEAD_RUNNING
    cc2 = _HEAD_STOPPED
    cc3 = _HEAD_ADV_ACK
    cc4 = _HEAD_RESET_ACK

[midiin]
    channel = _HEAD_FEEDBACK_CHANNEL
    ccnumber1 = 5
    ccnumber2 = 6
    ccnumber3 = 7
    ccnumber4 = 8
    cc1 = _HEAD_ADDRESS
    cc2 = _HEAD_ADDRESS_SOURCE
    cc3 = _HEAD_ADDRESS_MODE
    cc4 = _HEAD_DIRECTION
    cctrigger1 = _SYNC_ADDRESS
    cctrigger2 = _SYNC_ADDRESS_SOURCE
    cctrigger3 = _SYNC_ADDRESS_MODE
    cctrigger4 = _SYNC_DIRECTION

[midiin]
    channel = _HEAD_FEEDBACK_CHANNEL
    ccnumber1 = 9
    ccnumber2 = 10
    ccnumber3 = 11
    ccnumber4 = 12
    cc1 = _HEAD_CLOCK_SOURCE
    cc2 = _HEAD_CLOCK_MULT
    cc3 = _HEAD_TIME_CV
    cc4 = _HEAD_LOOP
    cctrigger1 = _SYNC_CLOCK_SOURCE
    cctrigger2 = _SYNC_CLOCK_MULT
    cctrigger3 = _SYNC_TIME_CV
    cctrigger4 = _SYNC_LOOP

[midiin]
    channel = _HEAD_FEEDBACK_CHANNEL
    ccnumber1 = 13
    ccnumber2 = 14
    cc1 = _HEAD_DISPLAY
    cc2 = _HEAD_HOLDING

# Feedback discrete states are raw small integers transported as MIDI values.
[math]
    input1 = _HEAD_ADDRESS_MODE
    input2 = 127
    product = _HEAD_ADDRESS_MODE_INDEX
[math]
    input1 = _HEAD_DIRECTION
    input2 = 127
    product = _HEAD_DIRECTION_INDEX
[math]
    input1 = _HEAD_CLOCK_SOURCE
    input2 = 127
    product = _HEAD_CLOCK_SOURCE_INDEX
[math]
    input1 = _HEAD_CLOCK_MULT
    input2 = 127
    product = _HEAD_CLOCK_MULT_INDEX
[math]
    input1 = _HEAD_LOOP
    input2 = 127
    product = _HEAD_LOOP_INDEX

# -------------------------------------------------
# HEAD transport buttons and feedback LEDs (controllers 8 and 9)
# -------------------------------------------------

# B8.1 Stop, B8.2 Play, B9.1 Hold indicator, B9.2 Advance,
# B8.3 Reset, B8.4 Virtual clock, B9.3 Display, B9.4 HEAD refresh.
[copy]
    input = _HEAD_STOPPED
    output = L8.1
[copy]
    input = _HEAD_RUNNING
    output = L8.2
[copy]
    input = _HEAD_HOLDING
    output = L9.1
[copy]
    input = _HEAD_ADV_ACK
    output = L9.2
[copy]
    input = _HEAD_RESET_ACK
    output = L8.3
[copy]
    input = B8.4
    output = L8.4
[copy]
    input = _HEAD_DISPLAY
    output = L9.3
[copy]
    input = B9.4
    output = L9.4
[copy]
    input = B7.1
    output = L7.1

# -------------------------------------------------
# HEAD pots with eight virtual presets selected by S1.2
# -------------------------------------------------

# P7.1 Address and P7.2 Time CV are continuous.
[pot]
    pot = P7.1
    preset = S1.2
    startvalue = _HEAD_ADDRESS
    clear = _SYNC_ADDRESS
    output = _EDIT_ADDRESS
    onchange = _MOVE_ADDRESS
    ledgauge = off
    display = 0
    dontsave = 1

[pot]
    pot = P7.2
    preset = S1.2
    startvalue = _HEAD_TIME_CV
    clear = _SYNC_TIME_CV
    output = _EDIT_TIME_CV
    onchange = _MOVE_TIME_CV
    ledgauge = off
    display = 0
    dontsave = 1

# P8.1 Address source (2 states), P8.2 Address mode (3 states).
[pot]
    pot = P8.1
    preset = S1.2
    discrete = 2
    startvalue = _HEAD_ADDRESS_SOURCE
    clear = _SYNC_ADDRESS_SOURCE
    output = _EDIT_ADDRESS_SOURCE
