# SpaceTime full Stage and Head remote
#
# S1.1 selects one of eight pages, covering all 64 stages.
# S1.2 selects HEAD 1-8. S1.3 up overrides the command target to HEAD ALL.
# E2.1-E3.4 edit the eight voltage values on the selected page.
# E4.1-E5.4 edit the eight time values on the selected page.
#
# Incoming feedback is authoritative. Each encoder has 128 discrete states,
# exactly matching MIDI values 0-127. Only physical encoder movement triggers
# MIDI output, so snapshots cannot echo back as edits.

# CONTROLLER 1:
#  S1.1: [Stage Page]
#  S1.2: [Head]
#  S1.3: [Head All]
#
# CONTROLLER 7 (rainbow):
#  B7.1: [Stage Refresh]
#  P7.1: [Address]
#  P7.2: [Time CV]
#
# CONTROLLERS 8/9 transport block:
#  B8.1: [Stop]
#  B8.2: [Play]
#  B9.1: [Hold]
#  B9.2: [Advance]
#  B8.3: [Reset]
#  B8.4: [Virtual Clock]
#  B9.3: [Display]
#  B9.4: [Head Refresh]
#
# HEAD parameter pots:
#  P8.1: [Address Source]
#  P8.2: [Address Mode]
#  P9.1: [Direction]
#  P9.2: [Clock Source]
#  P10.1: [Clock Div/Mult]
#  P10.2: [Loop]

[s10]
[e4]
[e4]
[e4]
[e4]
[b32]
[p2b8]
[p2b8]
[p2b8]
[p2b8]
[p10]

# -------------------------------------------------
# Stage page selection and snapshot request
# -------------------------------------------------

[copy]
    input = S1.1
    output = _STAGE_PAGE

[midiout]
    channel = 10
    usb = 1
    trs = 0
    ccnumber1 = 2
    cc1 = _STAGE_PAGE * 0.007874015748
    updateccs = B7.1
    delayinitialccs = 1

