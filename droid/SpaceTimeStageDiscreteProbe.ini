# SpaceTime DROID discrete bidirectional encoder probe
#
# B6.1 requests Stage page 1. E2.1 represents Stage 1 voltage as one of the
# exact MIDI values 0-127. Feedback selects the virtual value; physical turns
# are the only events that transmit it back to SpaceTime.

[s10]
[e4]
[e4]
[e4]
[e4]
[b32]
[p2b8]
[p2b8]
[p2b8]
[p2b8]
[p10]

[midiout]
    channel = 10
    usb = 1
    trs = 0
    ccnumber1 = 2
    cc1 = 0
    cctrigger1 = B6.1

# blue-7 input selector workaround: use MIDI-input auto-detection.
[midiin]
    channel = 15
    ccnumber1 = 0
    cc1 = R1

# midiin normalizes CC values to 0.0-1.0. Discrete encoder state is 0-127.
[math]
    input1 = R1
    input2 = 127
    product = _FEEDBACK_VALUE

[encoder]
    encoder = E2.1
    discrete = 128
    sensivity = 16
    movementticks = 1
    snapto = _FEEDBACK_VALUE
    snapforce = 0.1
    outputscale = 0.007874015748
    output = _EDIT_VALUE
    movedup = _UP
    moveddown = _DOWN
    color = 0.73

[logic]
    input1 = _UP
    input2 = _DOWN
    or = _MOVE

[midiout]
    channel = 15
    usb = 1
    trs = 0
    ccnumber1 = 0
    cc1 = _EDIT_VALUE
    cctrigger1 = _MOVE
